packages:
  - packages/*
  - examples/*

# Keep the toolchain reproducible across the monorepo: every workspace resolves
# the same TypeScript, bundler and test runner rather than drifting per package.
resolutionMode: highest

# Supply chain
# ------------
# Refuse any version published in the last 24 hours. Registry account
# compromises are typically caught and yanked within hours, so a short quarantine
# turns "we shipped the malicious release" into "we never resolved it".
minimumReleaseAge: 1440

# Packages allowed to run install scripts (preinstall/install/postinstall).
# pnpm 10 blocks them by default; this list is the deliberate exception set and
# is currently empty — nothing in the tree needs one. Adding an entry means
# accepting that package's arbitrary code execution at install time.
onlyBuiltDependencies: []
