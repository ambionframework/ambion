<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="556" viewBox="0 0 1110 556" role="img" aria-labelledby="title desc">
  <title id="title">A room and its workspace</title>
  <desc id="desc">Two people use one room. Person 1 is present, asks a question, and reads the result. Person 2 is away and catches up later. The room is an append-only journal. It records the question, activates three agents that run on Pi, the Claude Agent SDK, and the Codex SDK, and records what two of them say. The third agent has nothing to add and writes no entry. The exchange closes when no seat has work left, and a summary goes to Person 1. The agents call the tools of a shared workspace. The workspace has a required bash backend and an optional SQL backend. The read, write, edit, and bash tools run on the bash backend, which holds the files, the audit log, and the room mirrors. The sql tool runs on the SQL backend, which holds the tables and writes a CSV export through the bash backend. A message names what it cites, and a change names the activation that made it. A restart replays the journal entries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#666d6b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#2f817a"/>
    </marker>
    <marker id="cross" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12">
      <path d="M2 2 10 10 M10 2 2 10" stroke="#c0503a" stroke-width="2.4" stroke-linecap="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#232a2b" flood-opacity="0.08"/>
    </filter>
    <style>
