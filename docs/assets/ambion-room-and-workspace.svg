  <text x="266" y="398" text-anchor="start" class="sans ink b">summary</text>
  <text x="266" y="420" text-anchor="start" class="sans dim s">for Person 1</text>
  <line x1="220" y1="444" x2="480" y2="444" class="rule"/>
  <text x="240" y="474" text-anchor="start" class="sans dim s">A restart replays the entries.</text>
  <g filter="url(#shadow)">
    <rect x="548" y="64" width="180" height="120" rx="14" fill="#fbfaf6" stroke="#8fa8ef" stroke-width="2"/>
