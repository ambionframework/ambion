      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .ink { fill: #232a2b; }
      .dim { fill: #666d6b; }
      .teal { fill: #2f817a; }
      .red { fill: #c0503a; }
      .code { fill: #3f5bb5; }
      .lab { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .t { font-size: 19px; font-weight: 700; }
      .n { font-size: 16px; font-weight: 700; }
      .b { font-size: 16px; }
      .s { font-size: 14px; }
      .x { font-size: 13px; }
      .flow { fill: none; stroke: #666d6b; stroke-width: 2; }
      .flow-dash { fill: none; stroke: #666d6b; stroke-width: 2; stroke-dasharray: 6 5; }
      .flow-teal { fill: none; stroke: #2f817a; stroke-width: 2; stroke-dasharray: 6 5; }
      .flow-red { fill: none; stroke: #c0503a; stroke-width: 2; stroke-dasharray: 5 4; }
      .guide { stroke: #e2e0d8; stroke-width: 1.5; stroke-dasharray: 2 6; }
      .rule { stroke: #e2e0d8; stroke-width: 1.5; }
      .inner-rule { stroke: #bcd9d5; stroke-width: 1.5; }
    </style>
  </defs>
