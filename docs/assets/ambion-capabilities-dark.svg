<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc">
  <title id="title">A room and its workspace, by capability</title>
  <desc id="desc">A room activates an agent. The agent calls the tools of a shared workspace, and it says what it finds, with refs to what it names. Every workspace gives an agent background work: bash starts a process that continues past the activation, and ps, status, wait, and cancel reach it. Each activation starts with a reminder of what is still running. An optional shared database gives the sql tool: agents pass work to each other through a table or a view. An optional repositories backend gives repos and fork: an agent forks a read-only template, clones it into its home, and pushes; a push runs as git inside a bash process. Every workspace gives an agent shared files, with read, write, and edit: this is the base every other capability writes through. A background process writes its output there. A database export writes a CSV file there. A fork clones a working copy there. Shared files also holds the audit log, one entry for every tool call, and the room mirror, one file of the room&#x27;s messages. The host, outside the room and the workspace, lists, follows, and cancels every agent&#x27;s processes, and it can wake the owner seat with a message when one ends. A message names what it cites, and an entry names the activation that made it. A restart replays the room&#x27;s entries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a3aba8"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6cc4bb"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/></filter>
