      .b { font-size: 14px; }
      .s { font-size: 13px; }
      .x { font-size: 13px; }
      .c { font-size: 13px; }
      .lab { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .flow { fill: none; stroke: #a3aba8; stroke-width: 2; }
      .flow-dash { fill: none; stroke: #a3aba8; stroke-width: 2; stroke-dasharray: 6 5; }
      .flow-teal { fill: none; stroke: #6cc4bb; stroke-width: 2; stroke-dasharray: 6 5; }
      .rule { stroke: #384143; stroke-width: 1.5; }
    </style>
