  <rect x="810" y="198" width="276" height="474" rx="14" fill="#fbfaf6" stroke="#7fc468" stroke-width="1.5"/>
  </g>
  <rect x="230" y="198" width="566" height="66" rx="14" fill="#f6ecd8" stroke="#e0a94e" stroke-width="1.5"/>
  <rect x="810" y="198" width="276" height="66" rx="14" fill="#e8f5e2" stroke="#7fc468" stroke-width="1.5"/>
  <text x="371.5" y="226" text-anchor="middle" class="mono ink h">memoryBackend()</text>
  <text x="654.5" y="226" text-anchor="middle" class="mono ink h">directoryBackend(root)</text>
  <text x="513.0" y="250" text-anchor="middle" class="mono dim x">@ambionframework/just-bash</text>
  <text x="948.0" y="226" text-anchor="middle" class="mono ink h">workstationBackend(options)</text>
  <text x="948.0" y="250" text-anchor="middle" class="mono dim x">@ambionframework/workstation</text>
  <line x1="513.0" y1="208" x2="513.0" y2="234" class="split"/>
  <text x="24" y="290" text-anchor="start" class="sans ink rl">Files</text>
  <text x="371.5" y="290" text-anchor="middle" class="sans ink s">In the host&#x27;s memory</text>
  <text x="654.5" y="290" text-anchor="middle" class="sans ink s">A directory on the host</text>
  <line x1="513.0" y1="272" x2="513.0" y2="296" class="split"/>
  <text x="948.0" y="290" text-anchor="middle" class="sans ink s">One server, over SFTP</text>
  <line x1="24" y1="304" x2="1086" y2="304" class="rule"/>
  <text x="24" y="330" text-anchor="start" class="sans ink rl">Shell</text>
  <text x="513.0" y="330" text-anchor="middle" class="sans ink s">just-bash, in the host&#x27;s process</text>
  <text x="948.0" y="330" text-anchor="middle" class="sans ink s">Real bash, over SSH</text>
  <line x1="24" y1="344" x2="1086" y2="344" class="rule"/>
  <text x="24" y="370" text-anchor="start" class="sans ink rl">Commands</text>
  <text x="513.0" y="370" text-anchor="middle" class="sans ink s">coreutils, jq, sqlite3, js-exec, python3</text>
  <text x="948.0" y="370" text-anchor="middle" class="sans ink s">What the server installs</text>
  <line x1="24" y1="384" x2="1086" y2="384" class="rule"/>
  <text x="24" y="410" text-anchor="start" class="sans ink rl">Agents</text>
  <text x="513.0" y="410" text-anchor="middle" class="sans ink s">One user: every home is readable</text>
  <text x="948.0" y="410" text-anchor="middle" class="sans ink s">One Unix account per agent</text>
  <line x1="24" y1="424" x2="1086" y2="424" class="rule"/>
  <text x="24" y="450" text-anchor="start" class="sans ink rl">Network</text>
  <text x="513.0" y="450" text-anchor="middle" class="sans ink s">None</text>
  <text x="948.0" y="450" text-anchor="middle" class="sans ink s">The server&#x27;s network</text>
  <line x1="24" y1="464" x2="1086" y2="464" class="rule"/>
  <text x="24" y="490" text-anchor="start" class="sans ink rl">git</text>
  <text x="513.0" y="490" text-anchor="middle" class="sans ink s">just-git, with the author locked</text>
  <text x="948.0" y="490" text-anchor="middle" class="sans ink s">Real git, the ssh transport</text>
  <line x1="24" y1="504" x2="1086" y2="504" class="rule"/>
  <text x="24" y="530" text-anchor="start" class="sans ink rl">Process output</text>
  <text x="513.0" y="530" text-anchor="middle" class="sans ink s">Written when the process ends</text>
  <text x="948.0" y="530" text-anchor="middle" class="sans ink s">Streams while the process runs</text>
  <line x1="24" y1="544" x2="1086" y2="544" class="rule"/>
  <text x="24" y="570" text-anchor="start" class="sans ink rl">Cancel, timeout</text>
  <text x="513.0" y="570" text-anchor="middle" class="sans ink s">The process stops, the file stays empty</text>
  <text x="948.0" y="570" text-anchor="middle" class="sans ink s">SIGKILL to the group, output kept</text>
  <line x1="24" y1="584" x2="1086" y2="584" class="rule"/>
  <text x="24" y="610" text-anchor="start" class="sans ink rl">After dispose</text>
  <text x="371.5" y="610" text-anchor="middle" class="sans ink s">The files are released</text>
  <text x="654.5" y="610" text-anchor="middle" class="sans ink s">The files stay on disk</text>
  <line x1="513.0" y1="592" x2="513.0" y2="616" class="split"/>
  <text x="948.0" y="610" text-anchor="middle" class="sans ink s">The files stay on the server</text>
  <line x1="24" y1="624" x2="1086" y2="624" class="rule"/>
  <text x="24" y="650" text-anchor="start" class="sans ink rl">Next host run</text>
  <text x="371.5" y="650" text-anchor="middle" class="sans ink s">Starts empty</text>
  <text x="654.5" y="650" text-anchor="middle" class="sans ink s">Reads the table, lost ones fail</text>
  <line x1="513.0" y1="632" x2="513.0" y2="656" class="split"/>
  <text x="948.0" y="650" text-anchor="middle" class="sans ink s">Reads the table, adopts live ones</text>
  <text x="24" y="708" text-anchor="start" class="sans dim lab">OPTIONAL BACKENDS</text>
