      .code { fill: #3f5bb5; }
      .lab { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .n { font-size: 16px; font-weight: 700; }
      .h { font-size: 15px; font-weight: 700; }
      .rl { font-size: 14px; font-weight: 700; }
      .s { font-size: 14px; }
      .x { font-size: 13px; }
      .rule { stroke: #e2e0d8; stroke-width: 1.5; }
      .split { stroke: #e2e0d8; stroke-width: 1.5; stroke-dasharray: 4 5; }
    </style>
  </defs>
