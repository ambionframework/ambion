<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="830" viewBox="0 0 1110 830" role="img" aria-labelledby="title desc">
  <title id="title">Workspace backends</title>
  <desc id="desc">What each workspace backend gives an agent. Every workspace has eight tools on its bash backend: read, write, and edit for files, and bash, ps, status, wait, and cancel for background processes. A process runs off the bash owner, writes its output to ~/.processes/&lt;handle&gt;/out, and each activation starts with a reminder of its processes. The files in ~/.processes hold the process table, so a new run of the host reads the same table: memoryBackend starts empty, directoryBackend reads the processes of the earlier run as failed, and workstationBackend adopts the processes that still run. The host lists, follows, and cancels processes through workspace.processes. One bash backend serves a workspace. memoryBackend and directoryBackend run just-bash in the host&#x27;s process: memory keeps files in memory, directory keeps them in a directory on the host. Both have a simulated shell with coreutils, jq, sqlite3, and python3, one user with every home readable, no network, just-git with a locked author, process output written when the process ends, and a cancel or timeout that leaves the output file empty. workstationBackend reaches one remote server over SSH and SFTP: a real bash, the commands the server installs, one Unix account per agent, the server network, real git over the ssh git transport, output that streams to the file while the process runs, and a cancel or timeout that sends SIGKILL to the process group and keeps the output. Two backends are optional: a SQL backend, sqliteBackend, adds the sql tool, and a git backend, justGitBackend, adds the repos and fork tools.</desc>
  <defs>
