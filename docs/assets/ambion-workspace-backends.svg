  <text x="192.5" y="83" text-anchor="middle" class="mono code s">write</text>
  <rect x="233" y="64" width="56" height="28" rx="8" fill="#eef5f4" stroke="#bcd9d5" stroke-width="1.5"/>
  <text x="261.0" y="83" text-anchor="middle" class="mono code s">edit</text>
  <text x="313" y="83" text-anchor="start" class="sans ink rl">Processes</text>
  <rect x="401" y="64" width="56" height="28" rx="8" fill="#e8ecfa" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="429.0" y="83" text-anchor="middle" class="mono code s">bash</text>
  <rect x="465" y="64" width="39" height="28" rx="8" fill="#e8ecfa" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="484.5" y="83" text-anchor="middle" class="mono code s">ps</text>
  <rect x="512" y="64" width="74" height="28" rx="8" fill="#e8ecfa" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="549.0" y="83" text-anchor="middle" class="mono code s">status</text>
  <rect x="594" y="64" width="56" height="28" rx="8" fill="#e8ecfa" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="622.0" y="83" text-anchor="middle" class="mono code s">wait</text>
  <rect x="658" y="64" width="74" height="28" rx="8" fill="#e8ecfa" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="695.0" y="83" text-anchor="middle" class="mono code s">cancel</text>
  <line x1="752" y1="60" x2="752" y2="140" class="rule"/>
  <text x="772" y="83" text-anchor="start" class="sans ink rl">Host</text>
  <text x="816" y="83" text-anchor="start" class="mono code s">workspace.processes</text>
  <text x="816" y="106" text-anchor="start" class="sans dim x">list · subscribe · cancel</text>
  <text x="44" y="116" text-anchor="start" class="sans dim x">A process runs off the bash owner, until it ends, times out, or gets a cancel. Up to 4 run per agent.</text>
  <text x="44" y="136" text-anchor="start" class="sans dim x">Files in ~/.processes/&lt;handle&gt;/ hold the state and the output. Each activation starts with a reminder.</text>
  <text x="24" y="186" text-anchor="start" class="sans dim lab">BASH BACKEND · ONE PER WORKSPACE</text>
