<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">A room stays open between questions</title>
  <desc id="desc">A room runs for four days. Two people visit and leave at different times. Each visit opens an exchange, and each exchange closes when no seat has work left. Three agents keep their seats for the whole time and activate only inside exchanges. On Wednesday the host restarts and the room replays its journal. A fourth agent takes a seat from the reserve. The workspace keeps every file and table across the restart. On Thursday a person returns and catches up on what they missed.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#232a2b" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, "IBM Plex Sans", system-ui, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .ink { fill: #232a2b; }
      .dim { fill: #6c7371; }
      .teal { fill: #3b8f88; }
      .red { fill: #c4553d; }
      .small { font-size: 13px; }
      .tag { font-size: 12px; }
      .body { font-size: 15px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .name { font-size: 15px; font-weight: 700; }
      .day { stroke: #e2e0d8; stroke-width: 1.5; }
      .seat { fill: #e6e4dc; }
      .visit { fill: #f7e6dd; stroke: #cf8b6b; stroke-width: 1.5; }
      .exchange { fill: #ecebe5; stroke: #232a2b; stroke-width: 1; }
      .file { fill: #fbfaf6; stroke: #bcd9d5; }
    </style>
  </defs>

  <rect width="1440" height="800" rx="28" fill="#f4f3ee"/>
  <text x="56" y="66" class="sans ink" font-size="32" font-weight="700">A room stays open between questions</text>
  <text x="56" y="98" class="sans dim" font-size="16">People visit and leave. Seats stay. Exchanges open and close. A restart replays the journal and loses nothing.</text>

  <!-- days -->
  <line x1="260" y1="140" x2="260" y2="700" class="day"/>
  <line x1="541" y1="140" x2="541" y2="700" class="day"/>
  <line x1="822" y1="140" x2="822" y2="700" class="day"/>
  <line x1="1103" y1="140" x2="1103" y2="700" class="day"/>
  <line x1="1384" y1="140" x2="1384" y2="700" class="day"/>
  <text x="400" y="160" text-anchor="middle" class="sans dim label">MONDAY</text>
  <text x="681" y="160" text-anchor="middle" class="sans dim label">TUESDAY</text>
  <text x="962" y="160" text-anchor="middle" class="sans dim label">WEDNESDAY</text>
  <text x="1243" y="160" text-anchor="middle" class="sans dim label">THURSDAY</text>

  <!-- people -->
  <text x="56" y="160" class="sans dim label">PEOPLE</text>
  <text x="56" y="204" class="sans ink name">Person 1</text>
  <text x="56" y="244" class="sans ink name">Person 2</text>
  <rect x="300" y="188" width="170" height="24" rx="12" class="visit"/>
  <text x="316" y="205" class="sans ink tag">visit · asks</text>
  <rect x="1130" y="188" width="220" height="24" rx="12" class="visit"/>
  <text x="1146" y="205" class="sans ink tag">visit · catches up, asks</text>
  <rect x="580" y="228" width="180" height="24" rx="12" class="visit"/>
  <text x="596" y="245" class="sans ink tag">visit · asks</text>

  <!-- restart -->
  <line x1="900" y1="176" x2="900" y2="700" stroke="#c4553d" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="770" y="266" width="260" height="26" rx="13" fill="#fbfaf6" stroke="#c4553d" stroke-width="1.5"/>
  <text x="900" y="284" text-anchor="middle" class="sans red tag" font-weight="700">host restarts · the room replays</text>

  <!-- room -->
  <text x="56" y="340" class="sans ink name">Room</text>
  <text x="56" y="360" class="sans dim small">one journal</text>
  <g filter="url(#shadow)">
    <rect x="260" y="316" width="1124" height="56" rx="12" fill="#fbfaf6" stroke="#232a2b" stroke-width="1.5"/>
  </g>
  <rect x="300" y="326" width="170" height="36" rx="8" class="exchange"/>
  <text x="314" y="341" class="sans ink tag" font-weight="700">exchange 1</text>
  <text x="314" y="356" class="sans dim tag">closed · summary</text>
  <rect x="580" y="326" width="180" height="36" rx="8" class="exchange"/>
  <text x="594" y="341" class="sans ink tag" font-weight="700">exchange 2</text>
  <text x="594" y="356" class="sans dim tag">closed · summary</text>
  <text x="930" y="349" class="sans dim tag">open · quiet</text>
  <rect x="1130" y="326" width="220" height="36" rx="8" class="exchange"/>
  <text x="1144" y="341" class="sans ink tag" font-weight="700">exchange 3</text>
  <text x="1144" y="356" class="sans dim tag">open</text>

  <!-- agents -->
  <text x="56" y="416" class="sans dim label">SEATS</text>
  <text x="56" y="452" class="sans ink name">Agent A</text>
  <text x="244" y="452" text-anchor="end" class="sans dim tag">Pi</text>
  <text x="56" y="492" class="sans ink name">Agent B</text>
  <text x="244" y="492" text-anchor="end" class="sans dim tag">Claude</text>
  <text x="56" y="532" class="sans ink name">Agent C</text>
  <text x="244" y="532" text-anchor="end" class="sans dim tag">Codex</text>
  <text x="56" y="572" class="sans ink name">Agent D</text>
  <text x="244" y="572" text-anchor="end" class="sans dim tag">Pi</text>

  <rect x="260" y="444" width="1124" height="8" rx="4" class="seat"/>
  <rect x="260" y="484" width="1124" height="8" rx="4" class="seat"/>
  <rect x="260" y="524" width="1124" height="8" rx="4" class="seat"/>
  <rect x="930" y="564" width="454" height="8" rx="4" class="seat"/>
  <text x="940" y="592" class="sans dim tag">seated from the reserve</text>

  <!-- activations: filled spoke, hollow stayed silent -->
  <rect x="306" y="438" width="60" height="20" rx="10" fill="#e8ecfa" stroke="#8fa8ef" stroke-width="1.5"/>
  <rect x="320" y="478" width="110" height="20" rx="10" fill="#e8f5e2" stroke="#7fc468" stroke-width="1.5"/>
  <rect x="306" y="518" width="40" height="20" rx="10" fill="#fbfaf6" stroke="#e0a94e" stroke-width="1.5"/>

  <rect x="586" y="438" width="50" height="20" rx="10" fill="#fbfaf6" stroke="#8fa8ef" stroke-width="1.5"/>
  <rect x="600" y="478" width="80" height="20" rx="10" fill="#e8f5e2" stroke="#7fc468" stroke-width="1.5"/>
  <rect x="610" y="518" width="130" height="20" rx="10" fill="#f6ecd8" stroke="#e0a94e" stroke-width="1.5"/>

  <rect x="1136" y="438" width="90" height="20" rx="10" fill="#e8ecfa" stroke="#8fa8ef" stroke-width="1.5"/>
  <rect x="1150" y="478" width="60" height="20" rx="10" fill="#fbfaf6" stroke="#7fc468" stroke-width="1.5"/>
  <rect x="1180" y="518" width="150" height="20" rx="10" fill="#f6ecd8" stroke="#e0a94e" stroke-width="1.5"/>
  <rect x="1150" y="558" width="120" height="20" rx="10" fill="#efe4f4" stroke="#b58ac9" stroke-width="1.5"/>

  <!-- legend -->
  <rect x="280" y="604" width="28" height="16" rx="8" fill="#e8f5e2" stroke="#7fc468" stroke-width="1.5"/>
  <text x="316" y="617" class="sans dim tag">an activation that spoke</text>
  <rect x="500" y="604" width="28" height="16" rx="8" fill="#fbfaf6" stroke="#7fc468" stroke-width="1.5"/>
  <text x="536" y="617" class="sans dim tag">an activation with nothing to add</text>

  <!-- workspace -->
  <text x="56" y="668" class="sans ink name">Workspace</text>
  <text x="56" y="688" class="sans dim small">files and tables</text>
  <g filter="url(#shadow)">
    <rect x="260" y="648" width="1124" height="52" rx="12" fill="#eef5f4" stroke="#bcd9d5" stroke-width="1"/>
  </g>
  <rect x="276" y="660" width="130" height="28" rx="8" class="file"/>
  <text x="341" y="679" text-anchor="middle" class="sans ink tag">a file</text>
  <rect x="420" y="660" width="110" height="28" rx="8" class="file"/>
  <text x="475" y="679" text-anchor="middle" class="sans ink tag">a table</text>
  <rect x="610" y="660" width="140" height="28" rx="8" class="file"/>
  <text x="680" y="679" text-anchor="middle" class="sans ink tag">a second file</text>
  <text x="920" y="679" class="sans teal tag">every file stays across the restart</text>
  <rect x="1180" y="660" width="150" height="28" rx="8" class="file"/>
  <text x="1255" y="679" text-anchor="middle" class="sans ink tag">new table rows</text>

  <!-- bottom band -->
  <line x1="56" y1="724" x2="1384" y2="724" stroke="#e2e0d8" stroke-width="1.5"/>
  <text x="56" y="758" class="sans ink body" font-weight="700">Seats stay between visits.</text>
  <text x="56" y="780" class="sans dim small">An agent activates only when its attention reaches an event.</text>
  <text x="520" y="758" class="sans ink body" font-weight="700">An exchange closes. The room stays open.</text>
  <text x="520" y="780" class="sans dim small">A returning person catches up on what they missed.</text>
  <text x="984" y="758" class="sans ink body" font-weight="700">A restart loses nothing.</text>
  <text x="984" y="780" class="sans dim small">The room replays the journal. The workspace keeps its files.</text>
</svg>
