<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">People, a room, agents on any framework, and a shared workspace</title>
  <desc id="desc">Two people use one room. One person is present and asks a question. The other person is away and catches up on return. The room journal records the question, activates three agents on Pi, the Claude Agent SDK, and the Codex SDK, and records what two of them say. The third agent has nothing to add and stays silent. The agents read and write files and tables in a shared workspace. The exchange closes when no work remains, and a summary replaces it in later prompts. A restart replays the journal and keeps the workspace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#6c7371"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3b8f88"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#232a2b" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: Inter, "IBM Plex Sans", system-ui, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .ink { fill: #232a2b; }
      .dim { fill: #6c7371; }
      .teal { fill: #3b8f88; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
      .title { font-size: 18px; font-weight: 700; }
      .flow { fill: none; stroke: #6c7371; stroke-width: 2; }
      .flow-dash { fill: none; stroke: #6c7371; stroke-width: 2; stroke-dasharray: 6 5; }
      .flow-teal { fill: none; stroke: #3b8f88; stroke-width: 2; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1440" height="760" rx="28" fill="#f4f3ee"/>
  <text x="56" y="66" class="sans ink" font-size="32" font-weight="700">People ask. Agents speak when they have something to add.</text>
  <text x="56" y="98" class="sans dim" font-size="16">The room keeps what is said. The workspace keeps what is made. A restart loses neither.</text>

  <!-- lane labels -->
  <text x="56" y="150" class="sans dim label">PEOPLE</text>
  <text x="384" y="150" class="sans dim label">ROOM</text>
  <text x="816" y="150" class="sans dim label">AGENTS · ANY FRAMEWORK</text>
  <text x="1112" y="150" class="sans dim label">WORKSPACE</text>

  <!-- people -->
  <g filter="url(#shadow)">
    <rect x="56" y="222" width="232" height="120" rx="16" fill="#fbfaf6" stroke="#cf8b6b" stroke-width="2"/>
    <rect x="56" y="412" width="232" height="120" rx="16" fill="#fbfaf6" stroke="#d9c6bb" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <text x="80" y="256" class="sans ink title">A person</text>
  <text x="80" y="280" class="sans dim small">owns the exchange</text>
  <rect x="80" y="298" width="72" height="24" rx="12" fill="#f7e6dd"/>
  <text x="116" y="315" text-anchor="middle" class="mono ink" font-size="11">present</text>

  <text x="80" y="446" class="sans ink title">Another person</text>
  <text x="80" y="470" class="sans dim small">catches up on return</text>
  <rect x="80" y="488" width="72" height="24" rx="12" fill="#ecebe5"/>
  <text x="116" y="505" text-anchor="middle" class="mono ink" font-size="11">away</text>

  <!-- room -->
  <g filter="url(#shadow)">
    <rect x="384" y="172" width="352" height="428" rx="18" fill="#fbfaf6" stroke="#232a2b" stroke-width="1.5"/>
  </g>
  <text x="404" y="206" class="sans ink title">Room</text>
  <text x="404" y="228" class="sans dim label" style="letter-spacing:1px">JOURNAL · APPEND-ONLY · REPLAYABLE</text>
  <line x1="384" y1="244" x2="736" y2="244" stroke="#e2e0d8" stroke-width="1.5"/>

  <g class="sans">
    <text x="404" y="278" class="mono dim" font-size="13">1</text>
    <text x="436" y="278" class="ink body">the person asks</text>
    <text x="436" y="298" class="dim small">opens the exchange</text>

    <text x="404" y="338" class="mono dim" font-size="13">2</text>
    <text x="436" y="338" class="ink body">agent A says</text>
    <text x="436" y="358" class="teal small">ref: the file it read</text>

    <text x="404" y="398" class="mono dim" font-size="13">3</text>
    <text x="436" y="398" class="ink body">agent B says</text>
    <text x="436" y="418" class="teal small">ref: the table row it wrote</text>

    <text x="404" y="458" class="mono dim" font-size="13">4</text>
    <text x="436" y="458" class="ink body">close</text>
    <text x="436" y="478" class="dim small">no seat has work left</text>

    <text x="404" y="518" class="mono dim" font-size="13">5</text>
    <text x="436" y="518" class="ink body">summary for the person</text>
    <text x="436" y="538" class="dim small">later prompts read it for 1–4</text>
  </g>
  <text x="404" y="580" class="sans dim small">A restart replays these entries.</text>

  <!-- agents -->
  <g filter="url(#shadow)">
    <rect x="816" y="176" width="232" height="112" rx="16" fill="#fbfaf6" stroke="#8fa8ef" stroke-width="2"/>
    <rect x="816" y="306" width="232" height="112" rx="16" fill="#fbfaf6" stroke="#7fc468" stroke-width="2"/>
    <rect x="816" y="436" width="232" height="112" rx="16" fill="#fbfaf6" stroke="#e0a94e" stroke-width="2"/>
  </g>
  <text x="836" y="208" class="sans ink title">Agent A</text>
  <text x="836" y="230" class="sans dim small">Pi</text>
  <rect x="836" y="248" width="64" height="24" rx="12" fill="#e8ecfa"/>
  <text x="868" y="265" text-anchor="middle" class="mono ink" font-size="11">spoke</text>

  <text x="836" y="338" class="sans ink title">Agent B</text>
  <text x="836" y="360" class="sans dim small">Claude Agent SDK</text>
  <rect x="836" y="378" width="64" height="24" rx="12" fill="#e8f5e2"/>
  <text x="868" y="395" text-anchor="middle" class="mono ink" font-size="11">spoke</text>

  <text x="836" y="468" class="sans ink title">Agent C</text>
  <text x="836" y="490" class="sans dim small">Codex SDK · nothing to add</text>
  <rect x="836" y="508" width="64" height="24" rx="12" fill="#f6ecd8"/>
  <text x="868" y="525" text-anchor="middle" class="mono ink" font-size="11">silent</text>

  <!-- workspace -->
  <g filter="url(#shadow)">
    <rect x="1112" y="172" width="272" height="428" rx="18" fill="#fbfaf6" stroke="#3b8f88" stroke-width="1.5"/>
  </g>
  <text x="1132" y="206" class="sans ink title">Workspace</text>
  <text x="1132" y="228" class="sans dim label" style="letter-spacing:1px">FILES · TABLES · AUDIT LOG</text>
  <line x1="1112" y1="244" x2="1384" y2="244" stroke="#e2e0d8" stroke-width="1.5"/>

  <rect x="1132" y="264" width="232" height="84" rx="12" fill="#eef5f4" stroke="#bcd9d5" stroke-width="1"/>
  <text x="1148" y="292" class="sans ink body" font-weight="700">Files</text>
  <text x="1148" y="316" class="sans dim small">changed through tools</text>

  <rect x="1132" y="362" width="232" height="84" rx="12" fill="#eef5f4" stroke="#bcd9d5" stroke-width="1"/>
  <text x="1148" y="390" class="sans ink body" font-weight="700">Tables</text>
  <text x="1148" y="414" class="sans dim small">rows one agent records</text>
  <text x="1148" y="432" class="sans dim small">and the next agent reads</text>

  <rect x="1132" y="460" width="232" height="84" rx="12" fill="#eef5f4" stroke="#bcd9d5" stroke-width="1"/>
  <text x="1148" y="488" class="sans ink body" font-weight="700">Audit log</text>
  <text x="1148" y="512" class="sans dim small">one line per tool call</text>

  <text x="1132" y="580" class="sans dim small">Resources own it. The room names it.</text>

  <!-- people <-> room -->
  <path d="M288 266 H384" class="flow" marker-end="url(#arrow)"/>
  <text x="336" y="256" text-anchor="middle" class="sans dim small">asks</text>
  <path d="M384 306 H288" class="flow" marker-end="url(#arrow)"/>
  <text x="336" y="328" text-anchor="middle" class="sans dim small">reads</text>
  <path d="M384 472 H288" class="flow-dash" marker-end="url(#arrow)"/>
  <text x="336" y="462" text-anchor="middle" class="sans dim small">catches up</text>

  <!-- room <-> agents -->
  <path d="M736 216 H816" class="flow" marker-end="url(#arrow)"/>
  <text x="776" y="206" text-anchor="middle" class="sans dim small">activates</text>
  <path d="M816 250 H736" class="flow" marker-end="url(#arrow)"/>
  <text x="776" y="272" text-anchor="middle" class="sans dim small">says</text>

  <path d="M736 346 H816" class="flow" marker-end="url(#arrow)"/>
  <text x="776" y="336" text-anchor="middle" class="sans dim small">activates</text>
  <path d="M816 380 H736" class="flow" marker-end="url(#arrow)"/>
  <text x="776" y="402" text-anchor="middle" class="sans dim small">says</text>

  <path d="M736 476 H816" class="flow" marker-end="url(#arrow)"/>
  <text x="776" y="466" text-anchor="middle" class="sans dim small">activates</text>
  <text x="776" y="508" text-anchor="middle" class="sans dim small">no entry</text>

  <!-- agents <-> workspace -->
  <path d="M1048 232 H1112" class="flow" marker-end="url(#arrow)"/>
  <text x="1080" y="222" text-anchor="middle" class="sans dim small">reads</text>
  <path d="M1048 362 H1112" class="flow" marker-end="url(#arrow)"/>
  <text x="1080" y="352" text-anchor="middle" class="sans dim small">writes</text>
  <path d="M1048 492 H1112" class="flow" marker-end="url(#arrow)"/>
  <text x="1080" y="482" text-anchor="middle" class="sans dim small">reads</text>

  <!-- refs and provenance -->
  <path d="M560 600 V636 H1248 V600" class="flow-teal" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
  <text x="904" y="628" text-anchor="middle" class="sans teal small">a message names what it cites · a change names the activation that made it</text>

  <!-- bottom band -->
  <line x1="56" y1="668" x2="1384" y2="668" stroke="#e2e0d8" stroke-width="1.5"/>
  <text x="56" y="702" class="sans ink body" font-weight="700">Silence is a result.</text>
  <text x="56" y="726" class="sans dim small">An exchange closes when no seat has work left.</text>
  <text x="520" y="702" class="sans ink body" font-weight="700">Stale speech is refused.</text>
  <text x="520" y="726" class="sans dim small">A say that read an old record gets the messages it missed.</text>
  <text x="984" y="702" class="sans ink body" font-weight="700">Any framework, one set of tools.</text>
  <text x="984" y="726" class="sans dim small">Every seat holds the same workspace tools.</text>
</svg>
