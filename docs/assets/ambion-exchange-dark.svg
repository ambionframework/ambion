  <text x="196" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">1</text>
  <text x="196" y="174" text-anchor="middle" class="sans ink s">ask</text>
  <circle cx="306" cy="140" r="11" fill="#e8e9e4"/>
  <text x="306" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">2</text>
  <text x="306" y="174" text-anchor="middle" class="sans ink s">A says</text>
  <text x="306" y="194" text-anchor="middle" class="sans teal s">ref: a file</text>
  <circle cx="452" cy="140" r="11" fill="#e8e9e4"/>
  <text x="452" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">3</text>
  <text x="452" y="174" text-anchor="middle" class="sans ink s">B → A</text>
  <text x="452" y="194" text-anchor="middle" class="sans teal s">ref: a new file</text>
  <circle cx="548" cy="140" r="11" fill="#e8e9e4"/>
  <text x="548" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">4</text>
  <text x="548" y="174" text-anchor="middle" class="sans ink s">A → Person</text>
  <circle cx="628" cy="140" r="11" fill="#e8e9e4"/>
  <text x="628" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">5</text>
  <text x="628" y="174" text-anchor="middle" class="sans ink s">close</text>
  <text x="628" y="194" text-anchor="middle" class="sans dim s">quiet</text>
  <circle cx="760" cy="140" r="11" fill="#e8e9e4"/>
  <text x="760" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">6</text>
  <text x="760" y="174" text-anchor="middle" class="sans ink s">summary</text>
  <text x="760" y="194" text-anchor="middle" class="sans dim s">of 1–5</text>
  <circle cx="856" cy="140" r="11" fill="#e8e9e4"/>
  <text x="856" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">7</text>
  <text x="856" y="174" text-anchor="middle" class="sans ink s">ask</text>
  <circle cx="944" cy="140" r="11" fill="#e8e9e4"/>
  <text x="944" y="144.5" text-anchor="middle" class="sans x" fill="#20282a" font-weight="700">8</text>
  <text x="944" y="174" text-anchor="middle" class="sans ink s">A says</text>
  <rect x="206" y="262" width="114" height="30" rx="15" fill="#25304f" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="220" y="282" text-anchor="start" class="sans ink s">reads a file</text>
  <rect x="186" y="364" width="280" height="30" rx="15" fill="#243a20" stroke="#86cc70" stroke-width="1.5"/>
  <text x="200" y="384" text-anchor="start" class="sans ink s">reads 1</text>
  <text x="358" y="384" text-anchor="start" class="sans ink s">reads 2</text>
  <rect x="468" y="262" width="94" height="30" rx="15" fill="#25304f" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="482" y="282" text-anchor="start" class="sans ink s">reads 3</text>
  <rect x="868" y="262" width="90" height="30" rx="15" fill="#25304f" stroke="#8fa8ef" stroke-width="1.5"/>
  <text x="882" y="282" text-anchor="start" class="sans ink s">reads 6–7</text>
  <rect x="852" y="364" width="112" height="30" rx="15" fill="#3d321c" stroke="#e4b060" stroke-width="1.5"/>
  <text x="868" y="384" text-anchor="start" class="sans ink s">silent</text>
  <text x="358" y="416" text-anchor="start" class="sans teal s">writes a new file</text>
  <rect x="206" y="302" width="422" height="8" rx="4" fill="#36615d"/>
  <line x1="320" y1="306" x2="468" y2="306" stroke="#6cc4bb" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="206" y="302" width="114" height="8" rx="4" fill="#6cc4bb"/>
  <rect x="468" y="302" width="94" height="8" rx="4" fill="#6cc4bb"/>
  <rect x="868" y="302" width="90" height="8" rx="4" fill="#6cc4bb"/>
  <text x="206" y="330" text-anchor="start" class="sans teal s">a fresh session</text>
  <text x="468" y="330" text-anchor="start" class="sans teal s">resumes the session</text>
  <text x="972" y="330" text-anchor="end" class="sans teal s">a fresh session</text>
  <path d="M186 204 V362" class="flow" marker-end="url(#arrow)"/>
  <path d="M206 204 V260" class="flow" marker-end="url(#arrow)"/>
  <text x="218" y="228" text-anchor="start" class="sans dim s">activates</text>
  <text x="218" y="246" text-anchor="start" class="sans dim s">broadcast</text>
