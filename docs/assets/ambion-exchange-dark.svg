<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="732" viewBox="0 0 1000 732" role="img" aria-labelledby="title desc">
  <title id="title">Exchanges and activations</title>
  <desc id="desc">Two exchanges on a time axis, with lanes for a person, the room journal, Agent A on Pi, and Agent B on the Claude Agent SDK. Exchange 1: the person asks with visit.send(), and the room records entry 1. The room activates A and B at broadcast attention, and they reason in parallel. A reads a file and says, entry 2, with a ref to the file. The first say of B read only entry 1, so it comes back missed with entry 2. B reads entry 2, writes a new file, and says to A, entry 3, with a ref to the new file. Entry 3 wakes A. The second activation of A resumes the harness session of its first and reads only entry 3. A answers the person, entry 4. No seat has work left, so the room closes the exchange, entry 5, and waitForClose() returns. A summary of entries 1 to 5 follows, entry 6, and waitForSummary() returns it. Exchange 2: the person asks again, entry 7. The third activation of A starts a fresh session and reads the summary and entry 7. A says, entry 8. B has nothing to add and stays silent. The record is durable, and a restart replays it. The harness session is a cache for one exchange. The workspace keeps the files, and an opt-in audit log names the activation that wrote each one. The steps of each activation go to the logger of the host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a3aba8"/></marker>
    <marker id="cross" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12"><path d="M2 2 10 10 M10 2 2 10" stroke="#ef8570" stroke-width="2.4" stroke-linecap="round"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/></filter>
    <style>
