      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .ink { fill: #e8e9e4; } .dim { fill: #a3aba8; } .teal { fill: #6cc4bb; } .red { fill: #ef8570; } .code { fill: #a4b6f2; }
      .n { font-size: 16px; font-weight: 700; } .s { font-size: 14px; } .x { font-size: 13px; } .c { font-size: 13px; } .lab { font-size: 13px; font-weight: 700; }
      .flow { fill: none; stroke: #a3aba8; stroke-width: 2; }
      .flow-red { fill: none; stroke: #ef8570; stroke-width: 2; stroke-dasharray: 5 4; }
      .guide { stroke: #384143; stroke-width: 1.5; stroke-dasharray: 2 6; }
      .split { stroke: #a3aba8; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>
