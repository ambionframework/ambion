  <text x="359" y="252" text-anchor="start" class="sans red s">with entry 2</text>
  <path d="M452 364 V208" class="flow" marker-end="url(#arrow)"/>
  <path d="M468 204 V260" class="flow" marker-end="url(#arrow)"/>
  <text x="478" y="237" text-anchor="start" class="sans dim s">wakes A</text>
  <path d="M548 262 V208" class="flow" marker-end="url(#arrow)"/>
  <path d="M852 204 V362" class="flow" marker-end="url(#arrow)"/>
  <path d="M868 204 V260" class="flow" marker-end="url(#arrow)"/>
  <path d="M944 262 V208" class="flow" marker-end="url(#arrow)"/>
  <path d="M170 440 H976" class="flow" stroke-opacity="0.5" marker-end="url(#arrow)"/>
  <text x="976" y="460" text-anchor="end" class="sans dim s">time</text>
  <g filter="url(#shadow)">
    <rect x="24" y="484" width="468" height="104" rx="12" fill="#20282a" stroke="#e8e9e4" stroke-width="1.5"/>
  </g>
  <text x="42" y="514" text-anchor="start" class="sans ink n">The record · durable</text>
  <text x="42" y="540" text-anchor="start" class="sans ink s">Every message, close, summary, and lease entry. A</text>
  <text x="42" y="561" text-anchor="start" class="sans ink s">lease entry names its harness session. Every</text>
  <text x="42" y="582" text-anchor="start" class="sans ink s">activation reads the record. A restart replays it.</text>
  <g filter="url(#shadow)">
    <rect x="508" y="484" width="468" height="104" rx="12" fill="#1c2e2d" stroke="#36615d" stroke-width="1.5"/>
  </g>
  <text x="526" y="514" text-anchor="start" class="sans teal n">The session · a cache</text>
  <text x="526" y="540" text-anchor="start" class="sans ink s">What the model saw and did, for one exchange. On</text>
  <text x="526" y="561" text-anchor="start" class="sans ink s">Node: the local disk. On Cloudflare: memory. When it</text>
  <text x="526" y="582" text-anchor="start" class="sans ink s">is lost, the next activation reads the record.</text>
  <g filter="url(#shadow)">
    <rect x="24" y="604" width="468" height="104" rx="12" fill="#20282a" stroke="#384143" stroke-width="1.5"/>
  </g>
  <text x="42" y="634" text-anchor="start" class="sans ink n">The workspace · files</text>
  <text x="42" y="660" text-anchor="start" class="sans ink s">A file stays in the workspace, and a message cites</text>
  <text x="42" y="681" text-anchor="start" class="sans ink s">it with a ref. An opt-in audit log names the</text>
  <text x="42" y="702" text-anchor="start" class="sans ink s">activation that wrote it.</text>
  <g filter="url(#shadow)">
    <rect x="508" y="604" width="468" height="104" rx="12" fill="#20282a" stroke="#384143" stroke-width="1.5"/>
  </g>
  <text x="526" y="634" text-anchor="start" class="sans ink n">The trace · the host's logs</text>
  <text x="526" y="660" text-anchor="start" class="sans ink s">The steps of each activation go to the logger that</text>
  <text x="526" y="681" text-anchor="start" class="sans ink s">the host passes in. No model in the room reads them.</text>
</svg>
