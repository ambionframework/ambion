  <text x="24" y="152" text-anchor="start" class="sans ink n">Room</text>
  <text x="24" y="172" text-anchor="start" class="sans dim s">the journal</text>
  <text x="24" y="279" text-anchor="start" class="sans ink n">Agent A</text>
  <text x="24" y="299" text-anchor="start" class="sans dim s">Pi</text>
  <text x="24" y="381" text-anchor="start" class="sans ink n">Agent B</text>
  <text x="24" y="401" text-anchor="start" class="sans dim s">Claude Agent SDK</text>
  <line x1="170" y1="80" x2="976" y2="80" class="guide"/>
  <line x1="170" y1="277" x2="976" y2="277" class="guide"/>
  <line x1="170" y1="379" x2="976" y2="379" class="guide"/>
  <line x1="834" y1="20" x2="834" y2="424" class="split"/>
  <text x="180" y="34" text-anchor="start" class="sans dim lab" letter-spacing="1.2">EXCHANGE 1</text>
  <text x="846" y="34" text-anchor="start" class="sans dim lab" letter-spacing="1.2">EXCHANGE 2</text>
