  <text x="870" y="64" text-anchor="start" class="mono code c">visit.send()</text>
  <text x="628" y="64" text-anchor="middle" class="mono code c">waitForClose()</text>
  <text x="760" y="64" text-anchor="middle" class="mono code c">waitForSummary()</text>
