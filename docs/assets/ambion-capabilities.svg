<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="640" viewBox="0 0 1260 640" role="img" aria-labelledby="title desc">
  <title id="title">A room and its workspace, by capability</title>
  <desc id="desc">A room activates an agent. The agent calls the tools of a shared workspace, and it says what it finds, with refs to what it names. Every workspace gives an agent background work. bash starts a process that continues past the activation. ps lists it, and status, wait, and cancel take its handle. Each activation starts with a reminder of the seat&#x27;s processes. An optional SQL backend gives a shared database: agents pass work to each other through a table or a view, with the sql tool. An optional git backend gives repositories: an agent forks a read-only template, clones it into its home, and pushes, with the repos and fork tools. Every workspace gives an agent files, with read, write, and edit. The other capabilities leave their files here: a background process leaves its output, a database export leaves a CSV file, and a fork leaves a cloned working copy. An opt-in audit log holds one line for every tool call, and an opt-in room mirror holds the room&#x27;s messages. The host, outside the room and the workspace, lists an agent&#x27;s processes, hears when one ends, and can cancel one; it can also post a message that opens or joins an exchange. A message names what it cites, and a tool call names the activation that made it. A restart replays the room&#x27;s entries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#666d6b"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2f817a"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#232a2b" flood-opacity="0.08"/></filter>
    <style>
