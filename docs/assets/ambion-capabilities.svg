  <text x="292" y="224" text-anchor="start" class="sans dim x">one seat, one</text>
  <text x="292" y="240" text-anchor="start" class="sans dim x">activation</text>
  <line x1="274" y1="254" x2="414" y2="254" class="rule"/>
  <text x="292" y="278" text-anchor="start" class="sans dim x">runs on any</text>
  <text x="292" y="294" text-anchor="start" class="sans dim x">framework</text>
  <g filter="url(#shadow)">
  <rect x="274" y="390" width="140" height="150" rx="14" fill="#fbfaf6" stroke="#9aa3a1" stroke-width="1.5" stroke-dasharray="6 5"/>
  </g>
  <text x="292" y="420" text-anchor="start" class="sans ink n">Host</text>
  <text x="292" y="438" text-anchor="start" class="sans dim x">application code</text>
  <rect x="292" y="450" width="104" height="22" rx="8" fill="#eef5f4" stroke="#bcd9d5"/>
  <text x="344" y="465" text-anchor="middle" class="mono code e">processes</text>
  <text x="292" y="494" text-anchor="start" class="sans dim x">lists, hears endings,</text>
  <text x="292" y="510" text-anchor="start" class="sans dim x">cancels. It can wake</text>
  <text x="292" y="526" text-anchor="start" class="sans dim x">a seat when one ends.</text>
  <g filter="url(#shadow)">
