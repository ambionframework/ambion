  <rect x="24" y="52" width="190" height="500" rx="16" fill="#fbfaf6" stroke="#232a2b" stroke-width="1.5"/>
  </g>
  <text x="44" y="86" text-anchor="start" class="sans ink t">Room</text>
  <text x="44" y="106" text-anchor="start" class="sans dim x">APPEND-ONLY</text>
  <text x="44" y="120" text-anchor="start" class="sans dim x">JOURNAL</text>
  <line x1="24" y1="132" x2="214" y2="132" class="rule"/>
  <text x="44" y="162" text-anchor="start" class="mono dim s">1</text>
  <text x="70" y="162" text-anchor="start" class="sans ink b">Person asks</text>
  <text x="70" y="182" text-anchor="start" class="sans dim x">opens the exchange</text>
  <text x="44" y="248" text-anchor="start" class="mono dim s">2</text>
  <text x="70" y="248" text-anchor="start" class="sans ink b">Agent says</text>
