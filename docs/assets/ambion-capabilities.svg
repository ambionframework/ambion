      .flow-dash { fill: none; stroke: #666d6b; stroke-width: 2; stroke-dasharray: 6 5; }
      .flow-teal { fill: none; stroke: #2f817a; stroke-width: 2; stroke-dasharray: 6 5; }
      .rule { stroke: #e2e0d8; stroke-width: 1.5; }
    </style>
