  <text x="44" y="334" text-anchor="start" class="mono dim s">3</text>
  <text x="70" y="334" text-anchor="start" class="sans ink b">Close</text>
  <text x="70" y="354" text-anchor="start" class="sans dim x">no seat has work left</text>
  <text x="44" y="420" text-anchor="start" class="mono dim s">4</text>
  <text x="70" y="420" text-anchor="start" class="sans ink b">Summary</text>
  <text x="70" y="440" text-anchor="start" class="sans dim x">for the person</text>
  <line x1="24" y1="466" x2="214" y2="466" class="rule"/>
  <text x="44" y="490" text-anchor="start" class="sans dim x">A restart replays</text>
  <text x="44" y="506" text-anchor="start" class="sans dim x">the entries.</text>
