  <text x="24" y="392" text-anchor="start" class="sans dim s">seats in rooms</text>
  <text x="24" y="500" text-anchor="start" class="sans ink n">Workspace</text>
  <text x="24" y="520" text-anchor="start" class="sans dim s">for agents:</text>
  <text x="24" y="538" text-anchor="start" class="sans dim s">tools, substrate</text>
