<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="628" viewBox="0 0 1000 628" role="img" aria-labelledby="title desc">
  <title id="title">A room, its agents, and the workspace</title>
  <desc id="desc">One exchange. A person asks with visit.send(), and the room records entry 1 in its journal. The host is application code: it seats the agents and posts events with room.post. The room activates Agent A, on Pi, and Agent B, on the Claude Agent SDK, and they reason in parallel. A reads a file in the workspace and says, entry 2, with a ref to the file. The first say of B read only entry 1, so it comes back missed with entry 2. B reads entry 2, writes a file in the workspace, and says, entry 3, with a ref to the new file. Entry 3 wakes A. A reads entry 3 and stays silent. No seat has work left, so the room closes the exchange, entry 4, and waitForClose() returns. A room started with summaryWriter adds an optional summary of entries 1 to 3, entry 5. A restart replays the entries. Both agents call the tools of one shared workspace. Files: read, write, and edit. Processes: bash, ps, and wait, and a process outlives the activation. Optional capabilities add tables, repositories, sensors, and skills. Each agent has a home of its own. A message cites a file with a ref.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#666d6b"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2f817a"/></marker>
    <marker id="cross" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="12" markerHeight="12"><path d="M2 2 10 10 M10 2 2 10" stroke="#c0503a" stroke-width="2.4" stroke-linecap="round"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#232a2b" flood-opacity="0.08"/></filter>
    <style>
      .sans { font-family: Inter, "IBM Plex Sans", system-ui, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
      .ink { fill: #232a2b; } .dim { fill: #666d6b; } .teal { fill: #2f817a; } .red { fill: #c0503a; } .code { fill: #3f5bb5; }
      .n { font-size: 16px; font-weight: 700; } .s { font-size: 14px; } .x { font-size: 13px; } .c { font-size: 13px; } .lab { font-size: 13px; font-weight: 700; }
      .flow { fill: none; stroke: #666d6b; stroke-width: 2; }
      .flow-red { fill: none; stroke: #c0503a; stroke-width: 2; stroke-dasharray: 5 4; }
      .flow-teal { fill: none; stroke: #2f817a; stroke-width: 2; stroke-dasharray: 6 5; }
      .guide { stroke: #e2e0d8; stroke-width: 1.5; stroke-dasharray: 2 6; }
    </style>
  </defs>
