<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="602" viewBox="0 0 1000 602" role="img" aria-labelledby="title desc">
  <title id="title">The canvas for people, the workspace for agents</title>
  <desc id="desc">People use the canvas. Agents sit between the canvas and the workspace. A canvas holds rooms and widgets. A person visits the root room with visit.send(). Another person visits a breakout room. A third person reads a widget. Each room is a shared journal. In the root room, a person asks, Agent A on Pi says, Agent B on Claude says, and the exchange closes. Agent B opens a breakout room with the breakout tool. The breakout room has a journal of its own, and the root room is its parent. Agent C on Codex says in the breakout room. Agent C shows a frame widget, a camera viewfinder, with the show tool. The host draws the widget. Its source is a process that the agent started, and the host reads it on $PORT. The agents call the tools of one shared workspace. Files: read, write, and edit, and a message cites a file with a ref. Snapshots: snapshot and restore. Skills and compose: compose joins tools in one call. Processes: bash and fetch. A process outlives the activation and can serve HTTP on $PORT.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#666d6b"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2f817a"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#232a2b" flood-opacity="0.08"/></filter>
    <style>
