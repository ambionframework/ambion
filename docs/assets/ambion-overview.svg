  <text x="24" y="132" text-anchor="start" class="sans ink n">Host</text>
  <text x="24" y="152" text-anchor="start" class="sans dim s">application code</text>
  <text x="24" y="198" text-anchor="start" class="sans ink n">Room</text>
  <text x="24" y="218" text-anchor="start" class="sans dim s">the journal</text>
  <text x="24" y="322" text-anchor="start" class="sans ink n">Agent A</text>
  <text x="24" y="342" text-anchor="start" class="sans dim s">Pi</text>
  <text x="24" y="402" text-anchor="start" class="sans ink n">Agent B</text>
  <text x="24" y="422" text-anchor="start" class="sans dim s">Claude Agent SDK</text>
  <text x="24" y="536" text-anchor="start" class="sans ink n">Workspace</text>
  <text x="24" y="556" text-anchor="start" class="sans dim s">shared</text>
  <line x1="170" y1="80" x2="976" y2="80" class="guide"/>
  <line x1="170" y1="132" x2="976" y2="132" class="guide"/>
  <line x1="170" y1="320" x2="976" y2="320" class="guide"/>
