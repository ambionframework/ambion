name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo prints enough on failure; keep the happy path readable.
  TURBO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  lemmascript:
    name: Verify contracts
    uses: midspiral/LemmaScript/.github/workflows/verify.yml@cb1dda6b958aede92a8f79e54d1a82735c8d498f
    with:
      backend: dafny
      # The tools that regenerate and verify come from this ref. It matches
      # the `lemmascript` version in package.json, so CI and a desk generate
      # the same Dafny. Bump both together.
      ls-ref: v0.6.1
      typecheck: false

  check:
    name: Lint, types, and package hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # The development version. It covers every library package and
          # examples/workbench, the one package on the higher, OpenTUI floor.
          node-version: 26.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:format
      - run: pnpm run check:types
      - run: pnpm run check:lint
      - run: pnpm run build

      # Every publishable package pins the same engines.node, and its pack
      # list holds dist, the README, and the license, and no source or config.
      - name: package hygiene
        run: pnpm run check:packages

      - name: packages pack cleanly
        run: |
          node scripts/version.mjs --check
          node scripts/publish.mjs --pack-only

  test:
    name: Test on Node 26.4.0 (library packages and examples/workbench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.4.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  test-library-floor:
    name: Test on Node 22.19.0 (library packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # examples/workbench depends on @opentui/core, which needs Node
      # >=26.4.0 for its FFI bridge to native Zig. Every library package
      # needs only Node >=22.19.0. Deleting the directory keeps pnpm from
      # scanning it as a workspace project, but pnpm-lock.yaml still lists
      # it as an importer, and --frozen-lockfile installs every importer
      # the lockfile names regardless of what pnpm-workspace.yaml finds on
      # disk. engine-strict would still fail on @opentui/core's floor, so
      # this job turns it off for the install: no library dependency needs
      # more than Node 22.19.0, and the test run below is the real proof of
      # that floor, stronger than the install-time check.
      - run: rm -rf examples/workbench

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.engine-strict=false
      - run: pnpm run test
