name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo prints enough on failure; keep the happy path readable.
  TURBO_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  lemmascript:
    name: Verify contracts
    uses: midspiral/LemmaScript/.github/workflows/verify.yml@cb1dda6b958aede92a8f79e54d1a82735c8d498f
    with:
      backend: dafny
      # The tools that regenerate and verify come from this ref. It matches
      # the `lemmascript` version in package.json, so CI and a desk generate
      # the same Dafny. Bump both together.
      ls-ref: v0.6.1
      typecheck: false

  check:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:format
      - run: pnpm run check:types
      - run: pnpm run check:lint

  test:
    name: Test on Node 26
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  cli:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The published artifact is `bin/ambion.mjs` plus `dist/`, so the smoke
      # test drives the real bin script rather than the TypeScript sources.
      # This checks the runtime guard and package resolution. Command tests
      # run in the workspace suite; cli-team-smoke.mjs checks a packed consumer.
      - name: ambion --version reports the manifest version
        run: |
          version="$(./packages/cli/bin/ambion.mjs --version)"
          expected="$(node -p "require('./packages/cli/package.json').version")"
          [ "$version" = "$expected" ] || {
            echo "ambion --version said '$version', expected '$expected'" >&2
            exit 1
          }

      - name: ambion --help resolves the runtime package
        run: ./packages/cli/bin/ambion.mjs --help | grep -q '@ambionframework/ambion'

      - name: an unknown command fails rather than passing quietly
        run: |
          if ./packages/cli/bin/ambion.mjs not-a-command >/dev/null 2>&1; then
            echo 'Expected a non-zero exit for an unknown command.' >&2
            exit 1
          fi

      - name: package hygiene
        run: pnpm run check:packages

      - name: packages pack cleanly
        run: |
          node scripts/version.mjs --check
          node scripts/publish.mjs --pack-only

      # Packs every package, installs the archives through file: overrides in a
      # project outside the repository, and runs `ambion new` for both
      # templates. Each generated project installs, typechecks, and runs.
      # Only third-party dependencies come from the registry. It needs no key.
      - name: generated projects install, typecheck, and run
        run: node scripts/cli-team-smoke.mjs
        timeout-minutes: 10
