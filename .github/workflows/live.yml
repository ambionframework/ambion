name: Live

# The live tier: the room on a real model, with a real key. It costs money and
# it talks to a provider, so it does not run on a pull request. It runs after a
# change lands on `main`, on a weekly schedule, and on demand.
# `docs/toolchain.md` §8 is the contract for it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: The model every live seat runs on, as provider/model-id
        type: string
        default: anthropic/claude-sonnet-5
  schedule:
    # Mondays at 06:00 UTC, before the week's first change lands.
    - cron: '0 6 * * 1'

# One run per ref. A new push to `main` supersedes the run it replaced, because
# a superseded run still costs money.
concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  live:
    name: Live tests on ${{ matrix.harness }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One harness failing does not stop the others: each run costs money
      # and says something about its own executor.
      fail-fast: false
      matrix:
        harness: [pi, claude, codex]
    env:
      AMBION_HARNESS: ${{ matrix.harness }}
      AMBION_MODEL: ${{ inputs.model || 'anthropic/claude-sonnet-5' }}
      # `pi` and `claude` read the Anthropic key. `codex` reads its own key
      # and runs its own model. A job sees the key of its harness only.
      ANTHROPIC_API_KEY: ${{ matrix.harness != 'codex' && secrets.ANTHROPIC_API_KEY || '' }}
      CODEX_API_KEY: ${{ matrix.harness == 'codex' && secrets.CODEX_API_KEY || '' }}
    steps:
      # A harness whose secret is empty skips: every later step waits on
      # this one. The run says which harness skipped.
      - name: the key is present
        id: key
        run: |
          if [ "$AMBION_HARNESS" = codex ]; then key="$CODEX_API_KEY"; else key="$ANTHROPIC_API_KEY"; fi
          if [ -n "$key" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No key for the $AMBION_HARNESS harness: the repository secret is empty, so the job skips."
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 26
          cache: pnpm
      - if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.present == 'true'
        run: pnpm run test:live
