version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The toolchain moves together; a single PR is easier to validate than six.
      toolchain:
        patterns:
          - knip
          - oxfmt
          - oxlint
          - tsdown
          - turbo
          - typescript
          - vitest
